[supervisord]
nodaemon=true
environment=POSTGRES_DB="escriptorium",POSTGRES_USER="escriptorium",POSTGRES_PASSWORD="escriptorium",PGSSLCERT="/tmp/postgresql.crt",OPENBLAS_NUM_THREADS="1",OMP_NUM_THREADS="1",MKL_NUM_THREADS="1",NUMEXPR_NUM_THREADS="1"

[program:postgres]
command=/usr/lib/postgresql/15/bin/postgres -D /etc/postgresql/15/main/
user=postgres
priority=1
startsecs=5
autorestart=true

[program:redis]
command=redis-server
autorestart=true
priority=100

[program:django-init]
command=/bin/bash "/django-init.sh"
directory=/home/escriptorium/escriptorium/app/
user=root
environment=POSTGRES_DB="escriptorium",POSTGRES_USER="escriptorium",POSTGRES_PASSWORD="escriptorium",PGSSLCERT="/tmp/postgresql.crt"
priority=10
autostart=true
startsecs=5
startretries=1
stdout_logfile=/var/log/escriptorium.log
stderr_logfile=/var/log/escriptorium.err

[program:uwsgi]
command=uwsgi --module=escriptorium.wsgi:application --master --processes=2 --http=:8000 --vacuum --die-on-term --static-map /static=/home/escriptorium/escriptorium/app/static --static-map /media=/home/escriptorium/escriptorium/app/media
directory=/home/escriptorium/escriptorium/app
environment=POSTGRES_DB="escriptorium",POSTGRES_USER="escriptorium",POSTGRES_PASSWORD="escriptorium",PGSSLCERT="/tmp/postgresql.crt"
user=escriptorium
priority=20
autostart=true
autorestart=true
stdout_logfile=/var/log/uwsgi.log
stderr_logfile=/var/log/uwsgi.err

[program:celery-cpu]
command=celery -A escriptorium worker -l INFO -E -Ofair --prefetch-multiplier 1 --loglevel=info --pool=solo --concurrency=1 --max-tasks-per-child=10 -Q default,live,low-priority
directory=/home/escriptorium/escriptorium/app/
user=escriptorium
autorestart=true

[program:celery-gpu]
command=celery -A escriptorium worker -l INFO -E -Ofair --prefetch-multiplier 1 --loglevel=info --pool=solo --concurrency=1 --max-tasks-per-child=1 -Q gpu
directory=/home/escriptorium/escriptorium/app/
user=escriptorium
autorestart=true

[program:flower]
command=celery --broker=redis://localhost:6379/0 flower --port=5555
directory=/home/escriptorium
user=escriptorium
autorestart=true
priority=1000


[program:channelserver]
command=daphne --bind 0.0.0.0 --port 5000 -v 1 escriptorium.asgi:application
directory=/home/escriptorium/escriptorium/app
environment=POSTGRES_DB="escriptorium",POSTGRES_USER="escriptorium",POSTGRES_PASSWORD="escriptorium",PGSSLCERT="/tmp/postgresql.crt"
user=escriptorium
priority=20
autostart=true
autorestart=true
stdout_logfile=/var/log/daphne.log
stderr_logfile=/var/log/daphne.err

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
